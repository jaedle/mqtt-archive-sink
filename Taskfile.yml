version: '3'

tasks:
  default:
    deps: [ci]

  fmt:
    desc: Format all Go code
    cmds:
      - go fmt ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  test:
    desc: Unit + embedded-broker tests (no external dependencies, Docker-free)
    cmds:
      - go test ./...

  test:e2e:
    desc: End-to-end against a real dockerized broker + sink (Docker required)
    cmds:
      - go test -tags e2e -count=1 ./test/e2e/...

  manage-dependencies:
    desc: Verify, tidy, and vendor Go module dependencies
    cmds:
      - go mod verify
      - go mod tidy
      - go mod vendor

  build:
    desc: Build static binaries
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -ldflags='-s -w' -o out/mqtt-archive-sink ./cmd/mqtt-archive-sink
      - go build -ldflags='-s -w' -o out/mqtt-archive-mcp ./cmd/mqtt-archive-mcp

  ci:
    desc: Full verification - fmt, lint, test, test:e2e, build (Docker required)
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: test:e2e
      - task: build

  release:
    desc: Run semantic-release - tags, GitHub release, changelog, versioned images (release:publish)
    cmds:
      - npm clean-install
      - npx semantic-release

  release:publish:
    desc: Build and push multi-platform images to Docker Hub, tagged VERSION and latest (called by semantic-release)
    requires:
      vars: [VERSION]
    cmds:
      - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - docker buildx build --push --platform linux/arm64,linux/amd64 -f build/package/Dockerfile --build-arg VERSION={{.VERSION}} --target sink -t jaedle/mqtt-archive-sink:{{.VERSION}} -t jaedle/mqtt-archive-sink:latest .
      - docker buildx build --push --platform linux/arm64,linux/amd64 -f build/package/Dockerfile --build-arg VERSION={{.VERSION}} --target mcp -t jaedle/mqtt-archive-mcp:{{.VERSION}} -t jaedle/mqtt-archive-mcp:latest .
