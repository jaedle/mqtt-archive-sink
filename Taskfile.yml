version: '3'

tasks:
  default:
    deps: [ci]

  fmt:
    desc: Format all Go code
    cmds:
      - go fmt ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  test:
    desc: Unit + embedded-broker tests (no external dependencies, Docker-free)
    cmds:
      - go test ./...

  test:e2e:
    desc: End-to-end against a real dockerized broker + sink (Docker required)
    cmds:
      - go test -tags e2e -count=1 ./test/e2e/...

  build:
    desc: Build static binary
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -ldflags='-s -w' -o out/mqtt-archive-sink ./cmd/mqtt-archive-sink

  ci:
    desc: Full verification - fmt, lint, test, test:e2e, build (Docker required)
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: test:e2e
      - task: build

  release:
    desc: Build and push multi-platform image to Docker Hub
    cmds:
      - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - docker buildx build --push --platform linux/arm64,linux/amd64 -f build/package/Dockerfile -t jaedle/mqtt-archive-sink:latest .
