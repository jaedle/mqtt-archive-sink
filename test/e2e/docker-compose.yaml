# Real-infra e2e stack: a real mosquitto broker + the actual sink image.
#
# Parallel-safe by construction (see AGENTS.md): callers pass a unique -p project
# name and a per-run ARCHIVE_HOST_DIR. No host ports are published — the broker is
# reached only over this compose network, so concurrent runs never collide.
services:
  broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  sink:
    build:
      context: ../..
      dockerfile: build/package/Dockerfile
      target: sink
    environment:
      MQTT_BROKER: tcp://broker:1883
      ARCHIVE_DIR: /data
      FLUSH_INTERVAL: 1s
      FSYNC_INTERVAL: 2s
      HEARTBEAT_FILE: /data/heartbeat
    volumes:
      - ${ARCHIVE_HOST_DIR}:/data
    depends_on:
      - broker

  # The read side: same archive, read-only, reachable from the host on an
  # ephemeral 127.0.0.1 port (no fixed host ports — parallel-safe).
  mcp:
    build:
      context: ../..
      dockerfile: build/package/Dockerfile
      target: mcp
    environment:
      ARCHIVE_DIR: /data
      AUTH_TOKEN: ${MCP_AUTH_TOKEN}
    ports:
      - "127.0.0.1::8080"
    volumes:
      - ${ARCHIVE_HOST_DIR}:/data:ro
